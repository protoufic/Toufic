name: Marketplace CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/argentina-marketplace-v1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev || true
      - run: npm test
